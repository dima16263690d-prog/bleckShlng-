name: Forge 1.12.2 build

on:
  push:
    branches:
      - feature/stripped-wood-backport
      - тест-001
      - fix/1.18-fluid-behavior-audit
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build mod
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build --stacktrace

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BleckShlng-Forge-1.12.2
          path: build/libs/*.jar
